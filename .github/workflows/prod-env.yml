name: prod-env-test

on:
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize ]
  push:
    branches: [ main ]

permissions:
      id-token: write
      contents: read

jobs:
  common_steps:
    runs-on: ubuntu-latest
    steps:
      - name: git clone the repository
        uses: actions/checkout@v3
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          
      - name: where am i
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            echo "PR!!"
          elif [ "${{ github.event_name }}" == "push" ]; then
            echo "Push!!"
          fi
          
  pull_request:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    environment: prod
    steps:

      - name: configure aws credentials for PR
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.ROLE}}
          aws-region: ${{ secrets.REGION }}

  push:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:     

      - name: configure aws credentials for Merge
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.ROLE_MERGE}}
          aws-region: "eu-central-1"
